# Website: publishes the team website (website/) to GitHub Pages on every push to main.
# Before publishing, it runs the tests and adds the latest JUnit and JaCoCo reports to the site,
# along with the architecture diagrams, so the published reports always match main.
#
# The repository stays private until submission, and GitHub Pages isn't available for private
# repositories on free accounts. So this workflow SKIPS ITSELF while the repo is private, and
# starts publishing as soon as the repo is made public.
#
# At submission: make the repo public, then a repository admin sets Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions", and runs this workflow from the Actions tab
# ("Run workflow").
# Site URL: https://dns2jtm.github.io/Eng1_Project_Team8/
#
# To preview the site locally at any time: ./gradlew test && scripts/build-website.sh
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    # Skip while the repository is private (see the comment at the top of this file).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Publish the reports even if a test fails: the report shows exactly which tests failed.
      - name: Run tests (generates test and coverage reports)
        continue-on-error: true
        run: ./gradlew test --continue --console=plain

      - name: Assemble site
        run: scripts/build-website.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
